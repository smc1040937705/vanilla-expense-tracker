<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人收支记账</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>💰 个人收支记账</h1>
    </header>
    
    <main class="main">
      <!-- 统计卡片 -->
      <section id="stat-cards" class="stat-cards"></section>
      
      <!-- 筛选栏 -->
      <section id="filter-bar" class="filter-bar"></section>
      
      <!-- 图表 -->
      <section id="chart-section" class="chart-section">
        <h2>📊 近7天收支趋势</h2>
        <canvas id="trend-chart"></canvas>
      </section>
      
      <!-- 添加记录按钮 -->
      <button id="add-record-btn" class="add-btn">+ 添加记录</button>
      
      <!-- 记录列表 -->
      <section id="record-list" class="record-list"></section>
    </main>
    
    <!-- 表单弹窗 -->
    <div id="form-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title">添加记录</h3>
          <button class="close-btn">&times;</button>
        </div>
        <form id="record-form">
          <div class="form-group">
            <label>类型 *</label>
            <div class="type-selector">
              <button type="button" class="type-btn active" data-type="expense">支出</button>
              <button type="button" class="type-btn" data-type="income">收入</button>
            </div>
          </div>
          
          <div class="form-group">
            <label for="amount">金额 *</label>
            <input type="number" id="amount" name="amount" placeholder="请输入金额" step="0.01">
            <div class="error-msg" id="amount-error"></div>
          </div>
          
          <div class="form-group">
            <label for="category">分类 *</label>
            <select id="category" name="category">
              <option value="">请选择分类</option>
            </select>
            <div class="error-msg" id="category-error"></div>
          </div>
          
          <div class="form-group">
            <label for="date">日期 *</label>
            <input type="date" id="date" name="date">
            <div class="error-msg" id="date-error"></div>
          </div>
          
          <div class="form-group">
            <label for="remark">备注</label>
            <textarea id="remark" name="remark" placeholder="请输入备注（可选）" rows="2"></textarea>
          </div>
          
          <div class="form-actions">
            <button type="button" class="cancel-btn">取消</button>
            <button type="submit" class="submit-btn">保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <script src="./src/utils/storage.js"></script>
  <script src="./src/utils/format.js"></script>
  <script src="./src/config/categories.js"></script>
  <script src="./src/data/mockData.js"></script>
  <script src="./src/store/index.js"></script>
  <script src="./src/components/StatCard.js"></script>
  <script src="./src/components/FilterBar.js"></script>
  <script src="./src/components/Chart.js"></script>
  <script src="./src/components/RecordList.js"></script>
  <script src="./src/components/RecordForm.js"></script>
  <script src="./src/main.js"></script>
</body>
</html>
