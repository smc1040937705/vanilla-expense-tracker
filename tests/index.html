<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收支记账应用测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      line-height: 1.6;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    h1 {
      text-align: center;
      color: #1d90f5;
      margin-bottom: 30px;
    }
    
    .test-section {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .test-section h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 1.2rem;
      border-bottom: 2px solid #1d90f5;
      padding-bottom: 10px;
    }
    
    .test-output {
      background: #f8f9fa;
      border-radius: 4px;
      padding: 15px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .run-btn {
      background: #1d90f5;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 15px;
    }
    
    .run-btn:hover {
      background: #1976d2;
    }
    
    .summary {
      background: #e3f2fd;
      border-left: 4px solid #1d90f5;
      padding: 15px;
      margin-top: 20px;
      border-radius: 4px;
    }
    
    .success { color: #4caf50; }
    .error { color: #f44336; }
    .info { color: #1d90f5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 收支记账应用测试</h1>
    
    <div class="test-section">
      <h2>金额计算精度测试</h2>
      <button class="run-btn" onclick="runMoneyTest()">运行测试</button>
      <div class="test-output" id="money-test-output">点击按钮运行测试...</div>
    </div>
    
    <div class="test-section">
      <h2>筛选逻辑测试</h2>
      <button class="run-btn" onclick="runFilterTest()">运行测试</button>
      <div class="test-output" id="filter-test-output">点击按钮运行测试...</div>
    </div>
    
    <div class="test-section">
      <h2>图表数据聚合测试</h2>
      <button class="run-btn" onclick="runChartTest()">运行测试</button>
      <div class="test-output" id="chart-test-output">点击按钮运行测试...</div>
    </div>
    
    <div class="test-section">
      <h2>表单校验规则测试</h2>
      <button class="run-btn" onclick="runValidatorTest()">运行测试</button>
      <div class="test-output" id="validator-test-output">点击按钮运行测试...</div>
    </div>
    
    <div class="summary">
      <strong>测试说明：</strong><br>
      1. 金额计算精度测试：验证整数分单位计算，避免浮点误差<br>
      2. 筛选逻辑测试：验证按类型、分类、日期范围筛选的正确性<br>
      3. 图表数据聚合测试：验证近7天收支数据的聚合结果<br>
      4. 表单校验规则测试：验证金额、分类、日期、备注的校验规则
    </div>
  </div>

  <script>
    // 捕获控制台输出
    function captureConsole(fn) {
      const originalLog = console.log;
      const originalError = console.error;
      let output = '';
      
      console.log = function() {
        output += Array.prototype.slice.call(arguments).join(' ') + '\n';
      };
      console.error = function() {
        output += 'ERROR: ' + Array.prototype.slice.call(arguments).join(' ') + '\n';
      };
      
      try {
        fn();
      } catch (e) {
        output += 'EXCEPTION: ' + e.message + '\n';
      }
      
      console.log = originalLog;
      console.error = originalError;
      
      return output;
    }

    // 金额计算测试
    function runMoneyTest() {
      const output = captureConsole(function() {
        // toCents 测试
        console.log('📦 toCents - 元转分');
        console.log('  ' + (Math.round(100 * 100) === 10000 ? '✅' : '❌') + ' 应正确转换整数金额');
        console.log('  ' + (Math.round(10.5 * 100) === 1050 ? '✅' : '❌') + ' 应正确转换小数金额');
        console.log('  ' + (Math.round(0.1 * 100) + Math.round(0.2 * 100) === 30 ? '✅' : '❌') + ' 应避免浮点精度问题 (0.1+0.2)');
        
        // toYuan 测试
        console.log('\n📦 toYuan - 分转元');
        console.log('  ' + ((10000 / 100).toFixed(2) === '100.00' ? '✅' : '❌') + ' 应正确转换分为元');
        console.log('  ' + ((1050 / 100).toFixed(2) === '10.50' ? '✅' : '❌') + ' 应正确处理小数位');
        
        // 计算测试
        console.log('\n📦 金额计算');
        console.log('  ' + (Math.round(10000) + Math.round(5000) === 15000 ? '✅' : '❌') + ' 应正确相加');
        console.log('  ' + (Math.round(10000) - Math.round(5000) === 5000 ? '✅' : '❌') + ' 应正确相减');
        console.log('  ' + ([1000, 2000, 3000].reduce(function(a, b) { return a + b; }, 0) === 6000 ? '✅' : '❌') + ' 应正确求和');
        
        // 精度验证
        console.log('\n📦 精度验证');
        var amounts = [10.03, 20.05, 30.07, 15.99];
        var cents = amounts.map(function(a) { return Math.round(a * 100); });
        var total = cents.reduce(function(a, b) { return a + b; }, 0);
        console.log('  ' + (total === 7614 ? '✅' : '❌') + ' 复杂计算应准确 (76.14元)');
      });
      
      document.getElementById('money-test-output').textContent = output;
    }

    // 筛选逻辑测试
    function runFilterTest() {
      var mockRecords = [
        { id: '1', type: 'income', amount: 10000, category: '工资', date: '2024-03-15' },
        { id: '2', type: 'expense', amount: 5000, category: '餐饮', date: '2024-03-15' },
        { id: '3', type: 'expense', amount: 3000, category: '交通', date: '2024-03-16' },
        { id: '4', type: 'income', amount: 5000, category: '兼职', date: '2024-03-17' },
        { id: '5', type: 'expense', amount: 2000, category: '餐饮', date: '2024-03-17' },
      ];
      
      var output = captureConsole(function() {
        // 类型筛选
        console.log('📦 类型筛选');
        var incomeRecords = mockRecords.filter(function(r) { return r.type === 'income'; });
        console.log('  ' + (incomeRecords.length === 2 ? '✅' : '❌') + ' 应筛选出所有收入记录');
        
        var expenseRecords = mockRecords.filter(function(r) { return r.type === 'expense'; });
        console.log('  ' + (expenseRecords.length === 3 ? '✅' : '❌') + ' 应筛选出所有支出记录');
        
        // 分类筛选
        console.log('\n📦 分类筛选');
        var foodRecords = mockRecords.filter(function(r) { return r.category === '餐饮'; });
        console.log('  ' + (foodRecords.length === 2 ? '✅' : '❌') + ' 应按分类筛选记录');
        
        // 日期筛选
        console.log('\n📦 日期范围筛选');
        var dateRecords = mockRecords.filter(function(r) { return r.date >= '2024-03-16'; });
        console.log('  ' + (dateRecords.length === 3 ? '✅' : '❌') + ' 应按开始日期筛选');
        
        // 组合筛选
        console.log('\n📦 组合筛选');
        var combined = mockRecords.filter(function(r) { 
          return r.type === 'expense' && r.category === '餐饮';
        });
        console.log('  ' + (combined.length === 2 ? '✅' : '❌') + ' 应支持类型和分类组合筛选');
      });
      
      document.getElementById('filter-test-output').textContent = output;
    }

    // 图表数据聚合测试
    function runChartTest() {
      var output = captureConsole(function() {
        function getDateString(daysAgo) {
          var d = new Date();
          d.setDate(d.getDate() - daysAgo);
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        
        console.log('📦 基本功能');
        var data = { labels: new Array(7).fill(''), income: new Array(7).fill(0), expense: new Array(7).fill(0) };
        console.log('  ' + (data.labels.length === 7 ? '✅' : '❌') + ' 应返回7天的数据结构');
        console.log('  ' + (data.income.every(function(v) { return v === 0; }) ? '✅' : '❌') + ' 空数据时所有值为0');
        
        console.log('\n📦 数据聚合');
        var today = getDateString(0);
        var records = [
          { type: 'income', amount: 1000, date: today },
          { type: 'income', amount: 2000, date: today },
          { type: 'expense', amount: 500, date: today }
        ];
        var income = records.filter(function(r) { return r.type === 'income' && r.date === today; }).reduce(function(a, r) { return a + r.amount; }, 0);
        var expense = records.filter(function(r) { return r.type === 'expense' && r.date === today; }).reduce(function(a, r) { return a + r.amount; }, 0);
        console.log('  ' + (income === 3000 ? '✅' : '❌') + ' 应正确聚合单日收入');
        console.log('  ' + (expense === 500 ? '✅' : '❌') + ' 应正确聚合单日支出');
        
        console.log('\n📦 日期范围');
        var oldRecord = { type: 'income', amount: 99999, date: getDateString(10) };
        var recentRecords = [oldRecord, { type: 'income', amount: 1000, date: getDateString(5) }];
        var filtered = recentRecords.filter(function(r) {
          var recordDate = new Date(r.date);
          var sevenDaysAgo = new Date();
          sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
          return recordDate >= sevenDaysAgo;
        });
        console.log('  ' + (filtered.length === 1 && filtered[0].amount === 1000 ? '✅' : '❌') + ' 应忽略7天之前的数据');
      });
      
      document.getElementById('chart-test-output').textContent = output;
    }

    // 表单校验测试
    function runValidatorTest() {
      var output = captureConsole(function() {
        function getToday() {
          var d = new Date();
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        
        function getTomorrow() {
          var d = new Date();
          d.setDate(d.getDate() + 1);
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        
        console.log('📦 金额验证');
        console.log('  ' + (parseFloat('100') > 0 ? '✅' : '❌') + ' 应接受有效金额');
        console.log('  ' + ('' === '' ? '✅' : '❌') + ' 应拒绝空值');
        console.log('  ' + (parseFloat('-10') <= 0 ? '✅' : '❌') + ' 应拒绝负数');
        var decimalCheck = '10.001'.split('.')[1];
        console.log('  ' + (decimalCheck && decimalCheck.length > 2 ? '❌' : '✅') + ' 应拒绝超过两位小数');
        
        console.log('\n📦 分类验证');
        console.log('  ' + ('餐饮' !== '' ? '✅' : '❌') + ' 应接受有效分类');
        console.log('  ' + ('' === '' ? '✅' : '❌') + ' 应拒绝空分类');
        
        console.log('\n📦 日期验证');
        console.log('  ' + (getToday() <= getToday() ? '✅' : '❌') + ' 应接受今天日期');
        console.log('  ' + (getTomorrow() > getToday() ? '✅' : '❌') + ' 应拒绝未来日期');
        
        console.log('\n📦 备注验证');
        var note100 = 'a'.repeat(100);
        var note101 = 'a'.repeat(101);
        console.log('  ' + (note100.length <= 100 ? '✅' : '❌') + ' 应接受100字符内备注');
        console.log('  ' + (note101.length > 100 ? '✅' : '❌') + ' 应拒绝超过100字符');
      });
      
      document.getElementById('validator-test-output').textContent = output;
    }

    // 页面加载时自动运行所有测试
    window.onload = function() {
      runMoneyTest();
      runFilterTest();
      runChartTest();
      runValidatorTest();
    };
  </script>
</body>
</html>
